org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Gradle daemon to prevent stale-daemon / incremental-cache corruption
# when builds are run back-to-back (flutter clean kills the build dir while
# a previous daemon still holds file handles on cache .tab files).
org.gradle.daemon=false
kotlin.incremental=false
