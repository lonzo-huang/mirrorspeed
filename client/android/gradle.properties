# -Xmx kept at 4G (not 8G): under compressed-oops the Java heap sits in the low
# 32GB and an 8G heap starves the native heap, crashing the daemon with a native
# malloc OOM (hs_err "Chunk::new"). 4G heap + 2G metaspace is plenty for a Flutter
# release build and leaves native-heap headroom.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Gradle daemon to prevent stale-daemon / incremental-cache corruption
# when builds are run back-to-back (flutter clean kills the build dir while
# a previous daemon still holds file handles on cache .tab files).
org.gradle.daemon=false
kotlin.incremental=false
