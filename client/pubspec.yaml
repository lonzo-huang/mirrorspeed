name: mirrorspeed_vpn
description: MirrorSpeed VPN — 高速全球加速
version: 2.2.3+67
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── AmneziaWG (drop-in replacement for wireguard_flutter) ───
  # Adds AWG obfuscation params (Jc/Jmin/Jmax/S1/S2/H1-H4) +
  # HMAC port hopping support. Covers Android, iOS, Windows.
  amneziawg_flutter:
    path: packages/amneziawg_flutter

  # ── Supabase ─────────────────────────────────────────────────
  supabase_flutter: ^2.8.0

  # ── State management ─────────────────────────────────────────
  provider: ^6.1.2

  # ── Storage ──────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # 用于试用状态的「强制落盘」持久化（强杀也不丢）
  path_provider: ^2.1.4

  # ── HTTP ─────────────────────────────────────────────────────
  http: ^1.2.2

  # ── Navigation ───────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Crypto (for wstunnel v9 JWT generation) ──────────────────
  crypto: ^3.0.3

  # ── Device info ──────────────────────────────────────────────
  device_info_plus: ^10.1.2

  # ── Deep links / OAuth callback ──────────────────────────────
  app_links: ^6.3.0

  # ── UI ───────────────────────────────────────────────────────
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # ── 广告（AdMob：开屏 + 激励视频；仅 Android/iOS，Windows 不构建）──
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/routes/
