group 'com.amneziawg.amneziawg_flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // JitPack — kept for future amneziawg-android migration
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    namespace 'com.amneziawg.amneziawg_flutter'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // WireGuard Android tunnel library (stable, well-tested).
    // AWG-specific config keys (Jc/Jmin/Jmax/S1/S2/H1-H4) are stripped in the
    // plugin's Kotlin code before parsing, so the tunnel works as standard
    // WireGuard on Android.  Port hopping + wstunnel fallback remain active.
    //
    // TODO: migrate to com.github.amnezia-vpn:amneziawg-android once JitPack
    //       builds are available and stable.
    implementation 'com.wireguard.android:tunnel:1.0.20230427'
}
