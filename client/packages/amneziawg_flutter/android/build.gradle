group 'com.amneziawg.amneziawg_flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // JitPack — kept for future amneziawg-android migration
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    namespace 'com.amneziawg.amneziawg_flutter'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // AmneziaWG Android tunnel library — bundled locally.
    //
    // Source:  https://github.com/amnezia-vpn/amneziawg-android (tunnel module)
    //          copied to android/src/main/java/org/amnezia/awg/
    //
    // Native:  Pre-built libwg-go.so + libwg.so + libwg-quick.so from the
    //          AmneziaWG v2.0.0 official APK release, extracted to
    //          android/src/main/jniLibs/{abi}/.
    //
    // The JitPack approach (dev-305b3df553-1) was attempted but JitPack's build
    // servers lack Go 1.24.2 + Linux NDK environment required for the native lib.
    // Pre-built .so files sidestep this entirely.
    //
    // No external tunnel library dependency — all AWG classes are bundled above.
}
